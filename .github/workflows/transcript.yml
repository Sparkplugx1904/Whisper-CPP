# Test Site (Do not delete)
name: Transcript Audio VOT

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  transcribe:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checking...
        run: |
          echo "./"
          ls
          echo "./bin/"
          ls ./bin
        
      - name: Clone Whisper-CPP dan keluarkan isinya ke ../
        continue-on-error: true
        run: |
          git clone https://github.com/Sparkplugx1904/Whisper-CPP.git temp_whisper
          mv temp_whisper ./
          rm -rf temp_whisper

      - name: Setup FFmpeg
        continue-on-error: true
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          chmod 777 ./bin

      - name: Run transcriptor CPP
        run: |
          # python3 -u transcriptor_cpp.py "https://github.com/Sparkplugx1904/voiceoftrisma/raw/refs/heads/main/assets/sample_vot.mp3" -m medium
          # python3 -u transcriptor_cpp.py "https://archive.org/download/vot-denpasar-20251122-183000/VOT-Denpasar_22-11-25-0.mp3" medium
          # python3 -u transcriptor_cpp.py "https://github.com/Sparkplugx1904/Whisper-CPP/raw/refs/heads/main/samples/sample_vot.wav" large-v3
          python3 -u transcriptor_cpp.py "https://archive.org/download/vot-denpasar-20251124-183031/VOT-Denpasar_24-11-25-3.mp3" -cm "https://huggingface.co/Sparkplugx1904/Indonesia-Whisper-GGML/resolve/main/ggml-small.bin"

      - name: Upload transcript artifact
        uses: actions/upload-artifact@v4
        with:
          name: vot-transcript
          path: transcripts/
          retention-days: 1
