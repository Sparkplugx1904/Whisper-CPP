# Test Site (Do not delete)
name: Transcript Audio VOT

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  transcribe:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:        
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: Sparkplugx1904/Whisper-CPP

      - name: Setup FFmpeg
        continue-on-error: true
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Checking...
        run: |
          echo "./"
          ls
          echo "./bin/"
          ls ./bin

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          chmod +x ./bin/*

      - name: Run transcriptor CPP
        run: |
          echo Downloading...
          mkdir -p transcripts
          curl -L -o transcripts/transcript.srt https://archive.org/download/vot-denpasar-20260307-183701/transcript.srt
          echo Descripting...
          python descriptor.py transcripts/transcript.srt -o transcripts/description.json

      - name: Upload transcript artifact
        uses: actions/upload-artifact@v4
        with:
          name: vot-transcript
          path: transcripts/
          retention-days: 1
